name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install, with every platform's native library for the binaries
        run: bun install --frozen-lockfile --os='*' --cpu='*'
      - name: Install bubblewrap and ripgrep
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep
          # See ci.yml: without this, bwrap fails to start and the sandbox tests
          # silently run unsandboxed instead of exercising the real thing.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Gates
        run: |
          npx tsc --noEmit
          bun test
          bun run build
      - name: Compile every target but Windows
        # Windows has no sandbox or credential-store equivalent yet: see
        # docs/feature-matrix.md and the add-windows-support change.
        run: bun run compile linux-x64 linux-arm64 darwin-x64 darwin-arm64
      - name: Smoke-test the Linux binary
        run: ./release/jamcli-linux-x64 --version
      - name: CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: release/jamcli.cdx.json
          upload-artifact: false
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/jamcli-*
      - name: Draft the release with the binaries, checksums, and SBOM
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          body_path: docs/CHANGELOG.md
          files: |
            release/jamcli-*
            release/SHA256SUMS
            release/jamcli.cdx.json
          fail_on_unmatched_files: true
