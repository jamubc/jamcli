name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install, with every platform's native library for the binaries
        run: bun install --frozen-lockfile --os='*' --cpu='*'
      - name: Gates
        run: |
          npx tsc --noEmit
          bun test
          bun run build
      - name: Compile every target
        run: bun run compile
      - name: Smoke-test the Linux binary
        run: ./release/jamcli-linux-x64 --version
      - name: Publish the binaries and their checksums
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/jamcli-*
            release/SHA256SUMS
          fail_on_unmatched_files: true
