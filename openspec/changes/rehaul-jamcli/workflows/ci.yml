name: CI

on: [push, pull_request]

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      TYPE_ERRORS_BASELINE: "22"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Type gate
        run: |
          npx tsc --noEmit > tsc.log 2>&1 || true
          count=$(grep -c "error TS" tsc.log || true)
          cat tsc.log
          echo "tsc --noEmit errors: $count (baseline $TYPE_ERRORS_BASELINE)"
          if [ "$count" -gt "$TYPE_ERRORS_BASELINE" ]; then
            echo "type gate failed: $count exceeds the baseline $TYPE_ERRORS_BASELINE"
            exit 1
          fi
      - name: Test
        run: bun test
      - name: Build
        run: bun run build

  performance:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Build
        run: bun run build
      - name: Measure against the budgets (D24)
        run: bun run bench -- --enforce --json bench.json
      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance
          path: bench.json
