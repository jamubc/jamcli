name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TYPE_ERRORS_BASELINE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install bubblewrap and ripgrep
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep
      - name: Install
        run: bun install --frozen-lockfile
      - name: Type gate
        shell: bash
        run: |
          npx tsc --noEmit > tsc.log 2>&1 || true
          count=$(grep -c "error TS" tsc.log || true)
          cat tsc.log
          echo "tsc --noEmit errors: $count (baseline $TYPE_ERRORS_BASELINE)"
          if [ "$count" -gt "$TYPE_ERRORS_BASELINE" ]; then
            echo "type gate failed: $count exceeds the baseline $TYPE_ERRORS_BASELINE"
            exit 1
          fi
      - name: Test
        run: bun test
      - name: Build
        run: bun run build

  conformance:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: ACP messages checked against the SDK schemas, MCP both eras, JSON-RPC framing, LSP
        run: bun test src/acp src/core/mcp src/core/protocols src/core/lsp src/services/__tests__/acpClient.test.ts

  security:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: bun install --frozen-lockfile
      - name: Sandbox escapes, hostile plugins, hooks, permissions, and redaction
        run: bun test src/core/sandbox src/core/plugins src/core/hooks src/core/permissions src/core/__tests__

  e2e:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - name: The interface, the headless command, and workflows end to end
        run: bun test src/tui src/cli src/core/workflows
      - name: Compile the Linux binary and run it
        run: |
          bun run compile linux-x64
          ./release/jamcli-linux-x64 --version

  performance:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Build
        run: bun run build
      - name: Measure against the budgets (D24)
        run: bun run bench -- --enforce --json bench.json
      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance
          path: bench.json
